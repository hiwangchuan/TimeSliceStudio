<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>TimeSliceStudio 技术支持 / Support</title>
  <meta name="description" content="TimeSliceStudio technical support page in Simplified Chinese, Traditional Chinese, and English.">
  <style>
    :root {
      --bg: #05090f;
      --bg-soft: #09111b;
      --panel: rgba(13, 25, 38, 0.78);
      --panel-strong: rgba(18, 35, 51, 0.92);
      --line: rgba(140, 180, 210, 0.18);
      --text: #eef6ff;
      --muted: #9fb0c3;
      --subtle: #6f8297;
      --accent: #36d5ff;
      --accent-2: #8ee8ff;
      --success: #55e6a5;
      --warning: #ffd166;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
      --max: 1180px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(54, 213, 255, 0.20), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(77, 123, 255, 0.16), transparent 26%),
        linear-gradient(180deg, #05090f 0%, #06101a 46%, #03070d 100%);
      min-height: 100vh;
      line-height: 1.65;
    }

    a { color: inherit; text-decoration: none; }

    .site-shell { min-height: 100vh; overflow: hidden; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(5, 9, 15, 0.76);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02)),
        radial-gradient(circle at 50% 10%, rgba(54,213,255,0.45), transparent 36%),
        #101923;
      border: 1px solid rgba(255,255,255,0.16);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 18px rgba(54,213,255,0.13), 0 10px 30px rgba(0,0,0,0.28);
    }

    .mark svg { width: 27px; height: 27px; }

    .brand-title { font-weight: 740; letter-spacing: -0.03em; font-size: 18px; line-height: 1.1; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

    nav {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      flex: 1;
      font-size: 14px;
      color: var(--muted);
    }

    nav a { padding: 8px 4px; white-space: nowrap; }
    nav a:hover { color: var(--accent-2); }

    .language-switcher {
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .language-switcher button {
      border: 0;
      color: var(--muted);
      background: transparent;
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .language-switcher button[aria-pressed="true"] {
      background: rgba(54, 213, 255, 0.16);
      color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(54, 213, 255, 0.25);
    }

    main { max-width: var(--max); margin: 0 auto; padding: 76px 24px 64px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.84fr);
      gap: 48px;
      align-items: center;
      min-height: 520px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 82px);
      line-height: 0.94;
      letter-spacing: -0.07em;
      font-weight: 820;
    }

    .gradient-text {
      background: linear-gradient(90deg, #f8fbff, #9ee9ff 45%, #35d6ff 72%, #f8fbff 100%);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 26px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .button.primary {
      color: #02121d;
      background: linear-gradient(135deg, var(--accent), #83edff);
      box-shadow: 0 18px 48px rgba(54, 213, 255, 0.24);
      border-color: transparent;
    }

    .support-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(15, 29, 44, 0.86), rgba(8, 17, 28, 0.72));
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .support-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: radial-gradient(circle at 50% 22%, rgba(54, 213, 255, 0.18), transparent 42%);
      pointer-events: none;
    }

    .timeline-visual {
      position: relative;
      z-index: 1;
      height: 280px;
      display: flex;
      align-items: center;
    }

    .filmstrip {
      width: 100%;
      height: 124px;
      border: 1px solid rgba(142, 232, 255, 0.18);
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 8px, transparent 8px 22px),
        linear-gradient(90deg, rgba(20,33,47,0.4), rgba(75,138,173,0.35), rgba(12,23,35,0.55));
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      padding: 12px;
    }

    .slice {
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(54,213,255,0.06)), var(--c);
      min-height: 100%;
      opacity: 0.84;
    }

    .playhead {
      position: absolute;
      left: 48%;
      top: 28px;
      bottom: 28px;
      width: 3px;
      background: linear-gradient(180deg, transparent, var(--accent), var(--accent), transparent);
      box-shadow: 0 0 24px rgba(54,213,255,0.9);
    }

    .playhead::before, .playhead::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 20px rgba(54,213,255,0.85);
    }
    .playhead::before { top: 0; }
    .playhead::after { bottom: 0; }

    .quick-status {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .status-pill {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .status-pill strong { display: block; font-size: 13px; color: var(--text); }
    .status-pill span { color: var(--muted); font-size: 12px; }

    .section { padding: 34px 0; }

    .section-header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 20px; }
    .section h2 { margin: 0; font-size: clamp(26px, 4vw, 42px); line-height: 1.08; letter-spacing: -0.045em; }
    .section-lead { color: var(--muted); max-width: 620px; margin: 10px 0 0; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
      padding: 22px;
      min-height: 178px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
    }

    .card h3 { margin: 0 0 10px; font-size: 19px; letter-spacing: -0.025em; }
    .card p, .card li { color: var(--muted); font-size: 15px; }
    .card ul, .card ol { padding-left: 20px; margin: 10px 0 0; }
    .card li + li { margin-top: 6px; }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border: 1px solid rgba(54,213,255,0.28);
      color: var(--accent);
      background: rgba(54,213,255,0.08);
    }

    details {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.035);
      padding: 16px 18px;
    }
    details + details { margin-top: 12px; }
    summary { cursor: pointer; font-weight: 720; }
    details p { color: var(--muted); margin: 10px 0 0; }

    .callout {
      border: 1px solid rgba(85,230,165,0.28);
      background: linear-gradient(135deg, rgba(85,230,165,0.10), rgba(54,213,255,0.06));
      border-radius: var(--radius-md);
      padding: 22px;
    }

    .contact-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      border: 1px solid rgba(54,213,255,0.26);
      border-radius: var(--radius-lg);
      padding: 28px;
      background: linear-gradient(135deg, rgba(54,213,255,0.12), rgba(18,35,51,0.82));
    }

    .footer {
      border-top: 1px solid var(--line);
      margin-top: 38px;
      padding: 30px 24px 42px;
      color: var(--subtle);
    }
    .footer-inner { max-width: var(--max); margin: 0 auto; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

    [data-i18n-block] { display: none; }
    [data-i18n-block].active { display: contents; }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 12px;
      background: var(--accent);
      color: #00111a;
      padding: 10px 12px;
      border-radius: 10px;
      z-index: 100;
      font-weight: 700;
    }
    .skip-link:focus { left: 12px; }

    @media (max-width: 920px) {
      .topbar-inner { flex-wrap: wrap; }
      .brand { min-width: auto; flex: 1; }
      nav { order: 3; width: 100%; overflow-x: auto; justify-content: flex-start; padding-bottom: 2px; }
      .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 24px; }
      .support-card { order: -1; }
      .grid, .grid.two { grid-template-columns: 1fr; }
      .contact-panel { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main { padding: 42px 16px 48px; }
      .topbar-inner { padding: 14px 16px; }
      .language-switcher { width: 100%; justify-content: space-between; }
      .language-switcher button { flex: 1; padding-inline: 8px; }
      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        overflow: visible;
        padding-bottom: 0;
      }
      nav a {
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.035);
        text-align: center;
      }
      nav a:last-child { grid-column: 1 / -1; }
      .hero-actions { flex-direction: column; }
      .button { width: 100%; justify-content: center; }
      .quick-status { grid-template-columns: 1fr; }
      .timeline-visual { height: 220px; }
      .section { padding: 26px 0; }
      .card, .contact-panel { padding: 18px; }
    }
  </style>
</head>

      const selected = copy[lang] ? lang : 'zh-Hans';
      html.lang = selected;
      nodes.forEach(node => {
        const key = node.getAttribute('data-i18n');
        node.textContent = copy[selected][key] || copy['zh-Hans'][key] || '';
      });
      buttons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === selected));
      });
      try { localStorage.setItem('timeslice-support-lang', selected); } catch (_) {}
    }

    buttons.forEach(button => button.addEventListener('click', () => applyLanguage(button.dataset.lang)));

    const preferred = (() => {
